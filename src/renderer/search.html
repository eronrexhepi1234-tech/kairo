<!doctype html>
<html data-font="modern">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self'">
<title>Kairo Suche</title>
<link rel="stylesheet" href="styles-v6.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/1.4 'Inter Var', 'Segoe UI', sans-serif; color: #eef2f8; }
  .box { position: absolute; inset: 8px; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column;
    background: rgba(18,21,30,.92); backdrop-filter: blur(30px) saturate(1.4); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.3); animation: in .28s cubic-bezier(.16,1,.3,1); }
  @keyframes in { from { opacity: 0; transform: translateY(-10px) scale(.98); } }
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .top svg { width: 22px; height: 22px; color: #ff7a45; flex: none; }
  input { flex: 1; border: 0; background: transparent; color: #fff; font: 500 20px 'Inter Var', sans-serif; outline: 0; }
  input::placeholder { color: #6c7488; }
  .kbd { font: 600 11px 'JetBrains Mono Var', monospace; color: #7f889c; padding: 3px 7px; border-radius: 6px; background: rgba(255,255,255,.06); }
  .list { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; }
  .grp { font: 700 10.5px 'Inter Var'; letter-spacing: .14em; text-transform: uppercase; color: #6c7488; padding: 10px 10px 4px; }
  .r { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; cursor: pointer; animation: rIn .3s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rIn { from { opacity: 0; transform: translateX(-6px); } }
  .r.sel { background: linear-gradient(90deg, rgba(255,122,69,.22), rgba(255,122,69,.06)); box-shadow: inset 3px 0 0 #ff7a45; }
  .r .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: rgba(255,255,255,.06); }
  .r .ic svg { width: 18px; height: 18px; }
  .t-app .ic { color: #6fd3ff; } .t-file .ic { color: #ffd27a; } .t-setting .ic { color: #b78cff; } .t-folder .ic { color: #3ddc97; } .t-calc .ic { color: #ff7a45; } .t-ask .ic { color: #ff7a45; }
  .r div { flex: 1; min-width: 0; } .r b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .r small { color: #8a93a6; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .t-calc b { font: 700 24px 'Space Grotesk Var', sans-serif; }
  .r .hint { font-size: 11px; color: #6c7488; opacity: 0; } .r.sel .hint { opacity: 1; }
  .answer { margin: 6px 8px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg, rgba(255,122,69,.14), rgba(122,92,255,.12)); border: 1px solid rgba(255,122,69,.25); animation: rIn .4s; }
  .answer p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.5; }
  .empty { padding: 40px; text-align: center; color: #6c7488; }
  .foot { display: flex; gap: 14px; padding: 9px 16px; border-top: 1px solid rgba(255,255,255,.07); font-size: 11.5px; color: #6c7488; }
  .dots { display: inline-flex; gap: 4px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: #ff7a45; animation: d 1s infinite; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes d { 50% { opacity: .2; transform: translateY(-3px); } }
</style>
</head>
<body>
<div class="box">
  <div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Suchen… Datei, Programm, Einstellung oder 12*7" autocomplete="off" spellcheck="false"><span class="kbd">Esc</span></div>
  <div class="list" id="list"><div class="empty">Dateien, Ordner, Programme, Einstellungen – oder rechne einfach: 12*7</div></div>
  <div class="foot"><span>↑↓ wählen</span><span>Enter öffnen</span><span>Shift+Enter Ordner</span><span>Tab Kairo fragen</span></div>
</div>
<script src="search.js"></script>
</body>
</html>
