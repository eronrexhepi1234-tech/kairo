<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #f2f2f2; overflow: hidden; }
  .card { margin: 8px; padding: 12px 14px; border-radius: 14px; background: rgba(16,16,18,.82); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: in .4s cubic-bezier(.2,.8,.2,1); max-height: 190px; overflow: hidden; }
  @keyframes in { from { opacity: 0; transform: translateY(-8px); } }
  .top { display: flex; justify-content: space-between; font: 11px "Cascadia Code", Consolas, monospace; color: #ff7a45; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .big { font-size: 20px; font-weight: 600; }
  .muted { color: #a0a0a0; font-size: 12px; }
  ul { margin: 6px 0 0; padding-left: 16px; } li { margin: 1px 0; }
</style>
</head>
<body>
<div class="card" id="c"><div class="top"><span>Kairo coach</span><span>●</span></div><div class="muted">Waiting for the first analysis…</div></div>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  window.kairo.onOverlay(r => {
    const c = document.getElementById('c');
    c.style.animation = 'none'; c.offsetHeight; c.style.animation = '';
    if (r.data && r.profile === 'geoguessr') {
      const d = r.data;
      c.innerHTML = `<div class="top"><span>GeoGuessr</span><span>${d.confidence ?? '?'}%</span></div>
        <div class="big">${esc(d.country)}</div><div class="muted">${esc(d.region)} · ${(+d.lat).toFixed(2)}, ${(+d.lng).toFixed(2)}</div>
        <ul>${(d.clues || []).slice(0, 3).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    } else {
      const text = r.raw.replace(/[#*`]/g, '').trim().slice(0, 420);
      c.innerHTML = `<div class="top"><span>${esc(r.profile)}</span><span>●</span></div><div>${esc(text).replace(/\n/g, '<br>')}</div>`;
    }
  });
</script>
</body>
</html>
